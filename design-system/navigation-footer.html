<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer — Hillside Auto Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #000;
    --white: #fff;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #aaa;
    --gray-600: #666;
    --gray-700: #444;
    --gray-800: #222;
    --font-en: 'Inter', system-ui, sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-serif-jp: 'Noto Serif JP', serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    color: var(--white);
    background: var(--black);
    line-height: 1.8;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  a { color:inherit; text-decoration:none; }

  /* ===== FOOTER (unified .ft, from site.css) ===== */
  .ft {
    background: var(--black); color: var(--white);
    padding: 80px 40px 32px;
  }
  .ft__top {
    display: flex; flex-direction: column; gap: 48px;
    padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .ft__logo {
    font-family: var(--font-en);
    font-size: 11px; font-weight: 500; letter-spacing: 0.3em;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .ft__desc { font-size: 12px; color: rgba(255,255,255,0.3); line-height: 2; }
  .ft__brand { max-width: 280px; }
  .ft__info { display: flex; flex-direction: column; gap: 16px; }
  .ft__info-line {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.7; margin: 0;
  }
  .ft__info-label {
    font-family: var(--font-en);
    font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.3);
  }
  .ft__info-val { color: rgba(255,255,255,0.65); }
  .ft__info-tel {
    font-family: var(--font-serif); font-size: 18px; font-weight: 400;
    color: var(--white) !important; letter-spacing: 0.01em;
    transition: opacity 0.3s ease; text-decoration: none;
  }
  .ft__info-tel:hover { opacity: 0.7; }
  .ft__right { display: flex; flex-direction: column; gap: 24px; }
  .ft__links {
    display: flex; flex-wrap: wrap; gap: 32px;
  }
  .ft__links a {
    font-family: var(--font-en);
    font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
    transition: color 0.3s ease; text-decoration: none;
  }
  .ft__links a:hover { color: var(--white); }
  .ft__social { display: flex; gap: 20px; }
  .ft__social a {
    color: rgba(255,255,255,0.3); transition: color 0.3s ease;
  }
  .ft__social a:hover { color: var(--white); }
  .ft__copy {
    padding-top: 32px; font-size: 10px; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.15);
  }
  @media (min-width: 768px) {
    .ft__top { flex-direction: row; justify-content: space-between; align-items: flex-start; }
  }
</style>
</head>
<body>

  <footer class="ft">
    <div class="ft__top">
      <div class="ft__brand">
        <div class="ft__logo">Hillside Auto</div>
        <p class="ft__desc">ヒルサイドオート株式会社<br>1949年創業・横浜市中区</p>
      </div>
      <div class="ft__info">
        <p class="ft__info-line">
          <span class="ft__info-label">住所</span>
          <span class="ft__info-val">〒231-0849<br>神奈川県横浜市中区麦田町1-40</span>
        </p>
        <p class="ft__info-line">
          <span class="ft__info-label">営業時間</span>
          <span class="ft__info-val">9:00 – 18:00（月〜土）</span>
        </p>
        <p class="ft__info-line">
          <span class="ft__info-label">電話</span>
          <a class="ft__info-val ft__info-tel" href="tel:045-641-3307">045-641-3307</a>
        </p>
      </div>
      <div class="ft__right">
        <div class="ft__links">
          <a href="#">Services</a>
          <a href="#">English</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
        <div class="ft__social">
          <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/></svg></a>
          <a href="#" aria-label="Facebook"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
          <a href="#" aria-label="LINE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
        </div>
      </div>
    </div>
    <p class="ft__copy">&copy; 2026 Hillside Auto Inc. All Rights Reserved.</p>
  </footer>

</body>
</html>
