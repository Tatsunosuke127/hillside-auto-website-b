<!-- @dsCard group="Navigation" name="Mobile menu overlay" subtitle="Full-black overlay, serif links + contact buttons" width="390" height="740" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile menu overlay — Hillside Auto Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #000;
    --white: #fff;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #aaa;
    --gray-600: #666;
    --gray-700: #444;
    --gray-800: #222;
    --font-en: 'Inter', system-ui, sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-serif-jp: 'Noto Serif JP', serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    color: var(--white);
    background: var(--black);
    line-height: 1.8;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  a { color:inherit; text-decoration:none; }
  button { cursor:pointer; font:inherit; border:none; background:none; color:inherit; }

  /* ===== NAV bar above the overlay (open state: hamburger = X) ===== */
  .nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
  }
  .nav__logo {
    font-family: var(--font-en); font-size: 18px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--white);
    text-decoration: none;
  }
  .nav__right { display: flex; align-items: center; gap: 16px; }
  .nav__lang {
    font-size: 10px; letter-spacing: 0.1em; display: flex; gap: 4px;
  }
  .nav__lang button {
    padding: 14px 10px; margin: -12px -4px; font-weight: 500; color: rgba(255,255,255,0.4);
    background: none; border: none; cursor: pointer; font-family: inherit; font-size: inherit;
  }
  .nav__lang button.active { color: var(--white); }
  .nav__menu {
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    width: 22px; cursor: pointer;
    box-sizing: content-box; padding: 13px; margin: -13px;
    background: none; border: none;
  }
  .nav__menu span { display: block; width: 100%; height: 1px; background: var(--white); }
  .nav__menu.active span:first-child { transform: rotate(45deg) translate(2.5px, 2.5px); }
  .nav__menu.active span:last-child { transform: rotate(-45deg) translate(2.5px, -2.5px); }

  /* ===== Mobile overlay (from site.css — rendered open/static) ===== */
  .nav-overlay {
    position: fixed; inset: 0; background: var(--black); z-index: 99;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow-y: auto;
  }
  .nav-overlay a {
    font-family: var(--font-serif); font-size: 36px; font-weight: 300;
    color: var(--white); padding: 16px 0;
    transition: opacity 0.3s ease;
    text-decoration: none;
  }
  .nav-overlay a:hover { opacity: 0.5; }
  .nav-overlay__contact {
    margin-top: 48px; display: flex; gap: 16px;
  }
  .nav-overlay__contact a {
    font-family: var(--font-en); font-size: 11px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.3); padding: 12px 28px;
  }
</style>
</head>
<body>

  <nav class="nav">
    <a href="#" class="nav__logo">Hillside Auto</a>
    <div class="nav__right">
      <div class="nav__lang">
        <button class="active">JP</button>
        <button>EN</button>
      </div>
      <button class="nav__menu active" aria-label="Menu">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="nav-overlay">
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">English</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <div class="nav-overlay__contact">
      <a href="tel:045-641-3307">045-641-3307</a>
      <a href="#">LINE</a>
    </div>
  </div>

</body>
</html>
