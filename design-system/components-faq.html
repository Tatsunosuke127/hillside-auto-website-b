<!-- @dsCard group="Components" name="FAQ accordion" subtitle="Minimal + accordion — open and closed states" width="800" height="480" -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ accordion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --black: #000;
      --white: #fff;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-400: #aaa;
      --gray-600: #666;
      --gray-700: #444;
      --gray-800: #222;
      --font-en: 'Inter', system-ui, sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-serif-jp: 'Noto Serif JP', serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      color: var(--black);
      background: var(--white);
      line-height: 1.8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
    }
    button { cursor:pointer; font:inherit; border:none; background:none; color:inherit; }

    /* ===== FAQ — minimal accordion ===== */
    .faq {
      padding: 48px 48px; max-width: 800px; margin: 0 auto;
    }
    .faq__head {
      font-size: 10px; font-weight: 500; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--gray-400);
      margin-bottom: 48px; padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-200);
    }
    .faq__item { border-bottom: 1px solid var(--gray-200); }
    .faq__q {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; font-size: 15px; font-weight: 400; text-align: left;
      gap: 16px; transition: opacity 0.3s ease;
    }
    .faq__q:hover { opacity: 0.5; }
    .faq__icon {
      font-size: 18px; font-weight: 300; color: var(--gray-400);
      transition: transform 0.4s var(--ease); flex-shrink: 0;
    }
    .faq__item.active .faq__icon { transform: rotate(45deg); }
    .faq__a {
      max-height: 0; overflow: hidden; transition: max-height 0.5s var(--ease);
    }
    .faq__item.active .faq__a { max-height: none; }
    .faq__a-inner {
      padding: 0 0 24px; color: var(--gray-600); font-size: 14px; line-height: 2;
    }
  </style>
</head>
<body>

  <section class="faq">
    <div class="faq__head">FAQ</div>

    <!-- OPEN state -->
    <div class="faq__item active">
      <button class="faq__q"><span>どんな車でも買取してもらえますか？</span><span class="faq__icon">+</span></button>
      <div class="faq__a"><div class="faq__a-inner">
        <p>はい、国産車・輸入車を問わず、年式・走行距離・状態に関わらず買取いたします。査定は無料、名義変更や抹消登録などの手続きはすべて当社で代行いたします。</p>
      </div></div>
    </div>

    <!-- CLOSED states -->
    <div class="faq__item">
      <button class="faq__q"><span>英語で対応してもらえますか？</span><span class="faq__icon">+</span></button>
      <div class="faq__a"><div class="faq__a-inner">
        <p>はい、全てのサービスを英語でご提供可能です。</p>
      </div></div>
    </div>
    <div class="faq__item">
      <button class="faq__q"><span>代車は用意してもらえますか？</span><span class="faq__icon">+</span></button>
      <div class="faq__a"><div class="faq__a-inner">
        <p>車検・修理期間中は無料の代車をご用意します。台数に限りがあるため、早めのご予約をおすすめします。</p>
      </div></div>
    </div>
  </section>

</body>
</html>
