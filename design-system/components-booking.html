<!-- @dsCard group="Components" name="Booking method cards" subtitle="Web予約 / LINE / 電話・メール — accordion colorway" width="800" height="300" -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking method cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --black: #000;
      --white: #fff;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-400: #aaa;
      --gray-600: #666;
      --gray-700: #444;
      --gray-800: #222;
      --font-en: 'Inter', system-ui, sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      color: var(--black);
      background: var(--white);
      line-height: 1.8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      padding: 48px;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== BOOKING METHODS — evidence-based visual hierarchy ===== */
    .booking-methods {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .booking-methods { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    .booking-method {
      position: relative;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 24px 24px 22px;
      text-decoration: none;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      border: 1px solid transparent;
      overflow: hidden;
    }
    .booking-method:hover { transform: translateY(-3px); }
    .booking-method__icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .booking-method__icon svg { width: 22px; height: 22px; }
    .booking-method__title {
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; margin-bottom: 4px;
      line-height: 1.3;
    }
    .booking-method__sub {
      font-size: 11px; font-weight: 400;
      letter-spacing: 0.08em; opacity: 0.7;
      text-transform: uppercase;
    }
    .booking-method__arrow {
      position: absolute; top: 24px; right: 24px;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .booking-method:hover .booking-method__arrow { transform: translate(3px, -3px); }

    /* PRIMARY — Web booking (accordion context: black card on white bg) */
    .booking-method--primary {
      background: #000; color: #fff; border-color: #000;
    }
    .booking-method--primary:hover { background: transparent; color: #000; }

    /* LINE — Brand color green */
    .booking-method--line {
      background: #06C755; color: #fff; border-color: #06C755;
    }
    .booking-method--line:hover { background: #05a847; border-color: #05a847; }

    /* OTHER — Outline (accordion context) */
    .booking-method--other {
      background: transparent;
      color: #000; border-color: rgba(0,0,0,0.2);
    }
    .booking-method--other:hover { border-color: #000; background: rgba(0,0,0,0.03); }
  </style>
</head>
<body>

  <div class="booking-methods">
    <a href="#" class="booking-method booking-method--primary">
      <div class="booking-method__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="booking-method__title">Web予約</div>
      <div class="booking-method__sub">24時間受付</div>
      <div class="booking-method__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg></div>
    </a>
    <a href="#" class="booking-method booking-method--line">
      <div class="booking-method__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div class="booking-method__title">LINE</div>
      <div class="booking-method__sub">気軽にチャット</div>
      <div class="booking-method__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg></div>
    </a>
    <a href="#" class="booking-method booking-method--other">
      <div class="booking-method__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div class="booking-method__title">電話・メール</div>
      <div class="booking-method__sub">その他連絡方法</div>
      <div class="booking-method__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg></div>
    </a>
  </div>

</body>
</html>
