<!-- @dsCard group="Components" name="Certified trust bar" subtitle="CERTIFIED label strip with top/bottom borders" width="800" height="240" -->
<!doctype html>
<html lang="ja" class="lang-ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certified trust bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --black: #000;
      --white: #fff;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-400: #aaa;
      --gray-600: #666;
      --gray-700: #444;
      --gray-800: #222;
      --font-en: 'Inter', system-ui, sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-serif-jp: 'Noto Serif JP', serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      color: var(--black);
      background: var(--white);
      line-height: 1.8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      padding: 48px 0;
    }

    /* ===== CERTIFIED TRUST BAR ===== */
    .certified {
      padding: 48px 40px;
      text-align: center;
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
    }
    .certified__label {
      display: block;
      font-family: var(--font-en); font-size: 10px; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gray-400); margin-bottom: 10px;
    }
    .certified__text {
      font-size: 14px; letter-spacing: 0.18em;
      color: var(--gray-800); margin: 0;
    }
  </style>
</head>
<body class="lang-ja">
  <section class="certified">
    <span class="certified__label">Certified</span>
    <p class="certified__text">官公庁担当整備工場・神奈川県認証工場</p>
  </section>
</body>
</html>
