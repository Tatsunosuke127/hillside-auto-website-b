<!-- @dsCard group="Navigation" name="Top navigation" subtitle="Transparent over hero / scrolled white states" width="900" height="440" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top navigation — Hillside Auto Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #000;
    --white: #fff;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #aaa;
    --gray-600: #666;
    --gray-700: #444;
    --gray-800: #222;
    --font-en: 'Inter', system-ui, sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-serif-jp: 'Noto Serif JP', serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    color: var(--black);
    background: var(--white);
    line-height: 1.8;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    padding: 32px;
  }

  a { color:inherit; text-decoration:none; }
  button { cursor:pointer; font:inherit; border:none; background:none; color:inherit; }

  /* ===== NAV (from site.css — position made static for preview) ===== */
  .nav {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    transition: background 0.4s ease;
  }
  .nav--scrolled { background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--gray-200); }
  .nav__logo {
    font-family: var(--font-en); font-size: 18px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--white);
    transition: color 0.4s ease;
    text-decoration: none;
  }
  .nav--scrolled .nav__logo { color: var(--black); }
  .nav__links { display: flex; gap: 40px; }
  .nav__links a {
    font-size: 11px; font-weight: 500; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(255,255,255,0.7);
    transition: color 0.4s ease, opacity 0.3s ease;
    text-decoration: none;
  }
  .nav__links a:hover { opacity: 0.5; }
  .nav__links a.active { color: var(--white); }
  .nav--scrolled .nav__links a { color: var(--gray-600); }
  .nav--scrolled .nav__links a.active { color: var(--black); }
  .nav__right { display: flex; align-items: center; gap: 16px; }
  .nav__lang {
    font-size: 10px; letter-spacing: 0.1em; display: flex; gap: 4px;
  }
  .nav__lang button {
    padding: 14px 10px; margin: -12px -4px; font-weight: 500; color: rgba(255,255,255,0.4);
    transition: color 0.4s ease;
    background: none; border: none; cursor: pointer; font-family: inherit; font-size: inherit;
  }
  .nav__lang button.active { color: var(--white); }
  .nav--scrolled .nav__lang button { color: var(--gray-400); }
  .nav--scrolled .nav__lang button.active { color: var(--black); }
  .nav__menu {
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    width: 22px; cursor: pointer;
    box-sizing: content-box; padding: 13px; margin: -13px;
    background: none; border: none;
  }
  .nav__menu span { display: block; width: 100%; height: 1px; background: var(--white); transition: all 0.4s var(--ease); }
  .nav--scrolled .nav__menu span { background: var(--black); }

  /* ===== Preview scaffolding ===== */
  .ds-label {
    font-family: var(--font-en);
    font-size: 10px; font-weight: 500; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gray-400);
    margin: 0 0 12px;
  }
  .ds-state + .ds-label { margin-top: 40px; }
  .ds-strip--dark { background: #111; padding: 24px 0 64px; }
  .ds-strip--light { background: var(--gray-100); padding: 0 0 64px; }
</style>
</head>
<body>

  <p class="ds-label">Transparent — over hero</p>
  <div class="ds-state ds-strip--dark">
    <nav class="nav">
      <a href="#" class="nav__logo">Hillside Auto</a>
      <div class="nav__links">
        <a href="#">Services</a>
        <a href="#">English</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <div class="nav__right">
        <div class="nav__lang">
          <button class="active">JP</button>
          <button>EN</button>
        </div>
        <button class="nav__menu" aria-label="Menu">
          <span></span><span></span>
        </button>
      </div>
    </nav>
  </div>

  <p class="ds-label">Scrolled — white, border-bottom</p>
  <div class="ds-state ds-strip--light">
    <nav class="nav nav--scrolled">
      <a href="#" class="nav__logo">Hillside Auto</a>
      <div class="nav__links">
        <a href="#" class="active">Services</a>
        <a href="#">English</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <div class="nav__right">
        <div class="nav__lang">
          <button class="active">JP</button>
          <button>EN</button>
        </div>
        <button class="nav__menu" aria-label="Menu">
          <span></span><span></span>
        </button>
      </div>
    </nav>
  </div>

</body>
</html>
