<!-- @dsCard group="Conversion" name="Fixed CTAs" subtitle="Desktop sticky CTA (open / hover / closed) + 3-way mobile bar" width="860" height="640" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed CTAs — Hillside Auto Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #000;
    --white: #fff;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #aaa;
    --gray-600: #666;
    --gray-700: #444;
    --gray-800: #222;
    --font-en: 'Inter', system-ui, sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-serif-jp: 'Noto Serif JP', serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    color: var(--black);
    background: var(--white);
    line-height: 1.8;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ===== STICKY FLOATING CTA — desktop (from index.html) =====
     position:fixed / opacity:0 entrance removed for static preview */
  .stick-cta {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 28px; background: var(--black); color: var(--white);
    font-size: 11px; font-weight: 500; letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.3s ease;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .stick-cta.is-hover { background: var(--gray-800); }
  .stick-cta__dot {
    width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 0 4px rgba(74,222,128,0.2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(74,222,128,0.2); }
    50% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
  }
  /* Outside business hours (Mon–Sat 9–18 JST): calm gray, no pulse */
  .stick-cta__dot--closed {
    background: rgba(255,255,255,0.35);
    box-shadow: none;
    animation: none;
  }

  /* ===== MOBILE CTA BAR — 電話 / LINE / フォーム (from index.html) =====
     position:fixed removed for static preview */
  .mob-bar {
    width: 100%;
    display: flex;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
    background: var(--black);
  }
  .mob-bar a {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 16px 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--white); text-decoration: none;
    min-height: 56px; white-space: nowrap;
    transition: background 0.3s ease;
  }
  .mob-bar__tel { background: var(--black); }
  .mob-bar__line { background: #06C755; }
  .mob-bar__form { background: var(--gray-800); border-left: 1px solid rgba(255,255,255,0.12); }
  .mob-bar svg { display: block; flex-shrink: 0; }
  /* :active pressed states applied statically via .is-active */
  .mob-bar__tel.is-active { background: var(--gray-800); }
  .mob-bar__line.is-active { background: #05a847; }
  .mob-bar__form.is-active { background: var(--black); }

  /* ===== Preview scaffolding ===== */
  .ds-wrap { padding: 40px 44px 44px; }
  .ds-label {
    font-family: var(--font-en);
    font-size: 10px; font-weight: 500; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--gray-400);
    margin-bottom: 18px;
  }
  .ds-row {
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 18px 28px; margin-bottom: 40px;
  }
  .ds-state { display: flex; flex-direction: column; gap: 10px; }
  .ds-cap {
    font-family: var(--font-en);
    font-size: 9px; font-weight: 400; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gray-400);
  }
  /* Phone-width frame to compose the mobile bar */
  .ds-phone {
    width: 375px; max-width: 100%;
    border: 1px solid var(--gray-200);
  }
  .ds-phone__page {
    height: 56px; background: var(--gray-100);
  }
</style>
</head>
<body>
<div class="ds-wrap">

  <p class="ds-label">Sticky CTA — Desktop (.stick-cta)</p>
  <div class="ds-row">
    <div class="ds-state">
      <a class="stick-cta" href="#">
        <span class="stick-cta__dot"></span>
        <span>お問い合わせ</span>
      </a>
      <span class="ds-cap">Open hours / pulsing dot</span>
    </div>
    <div class="ds-state">
      <a class="stick-cta is-hover" href="#">
        <span class="stick-cta__dot"></span>
        <span>お問い合わせ</span>
      </a>
      <span class="ds-cap">Hover</span>
    </div>
    <div class="ds-state">
      <a class="stick-cta" href="#">
        <span class="stick-cta__dot stick-cta__dot--closed"></span>
        <span>お問い合わせ</span>
      </a>
      <span class="ds-cap">Outside hours / gray dot</span>
    </div>
  </div>

  <p class="ds-label">Mobile CTA Bar (.mob-bar) — 電話 / LINE / フォーム</p>
  <div class="ds-row">
    <div class="ds-state">
      <div class="ds-phone">
        <div class="ds-phone__page"></div>
        <div class="mob-bar">
          <a href="#" class="mob-bar__tel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>電話</span>
          </a>
          <a href="#" class="mob-bar__line">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            LINE
          </a>
          <a href="#" class="mob-bar__form">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>フォーム</span>
          </a>
        </div>
      </div>
      <span class="ds-cap">Default</span>
    </div>
    <div class="ds-state">
      <div class="ds-phone">
        <div class="ds-phone__page"></div>
        <div class="mob-bar">
          <a href="#" class="mob-bar__tel is-active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>電話</span>
          </a>
          <a href="#" class="mob-bar__line is-active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            LINE
          </a>
          <a href="#" class="mob-bar__form is-active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>フォーム</span>
          </a>
        </div>
      </div>
      <span class="ds-cap">Active (pressed)</span>
    </div>
  </div>

</div>
</body>
</html>
